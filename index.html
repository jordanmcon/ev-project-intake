<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Era — Charging as a Service</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Light.woff2') format('woff2'); font-weight:300; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
</style>
<style>
:root {
  --gold:#F8B918;--gold-dim:#c99610;--gold-glow:rgba(248,185,24,0.13);--gold-border:rgba(248,185,24,0.36);
  --bg:#28282D;--s1:#111013;--s2:#171519;--s3:#1E1C21;
  --border:rgba(255,255,255,0.07);--text:#FFFFFF;--muted:#D4D4D5;--dim:#BEBEC0;
  --r:11px;--font:'Haffer','DM Sans',sans-serif;--mono:'Haffer','DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-weight:300;font-size:1.02rem;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
#app.gone{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;text-decoration:none}
.prog-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.prog-lbl{font-size:11px;font-family:var(--mono);letter-spacing:.07em;color:var(--muted)}
.prog-track{width:260px;height:2px;background:var(--s3);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:var(--gold);border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1);box-shadow:0 0 7px rgba(248,185,24,.55)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 36px;overflow-y:auto;overflow-x:hidden;position:relative}
.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 50% 105%,rgba(248,185,24,.05) 0%,transparent 70%);pointer-events:none}
.slide{width:100%;max-width:900px;animation:sUp .4s cubic-bezier(.4,0,.2,1) both;align-self:flex-start;margin:auto}
.slide.out{animation:sDown .25s cubic-bezier(.4,0,.2,1) both}
@keyframes sUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sDown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px)}}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.8rem;letter-spacing:.13em;color:var(--gold);text-transform:uppercase;margin-bottom:13px}
.slide h1{font-size:clamp(26px,3.6vw,36px);font-weight:400;line-height:1.18;letter-spacing:-.025em;margin-bottom:7px}
.slide h1 em{font-style:normal;color:var(--gold)}
.slide .sub{font-size:1rem;color:var(--dim);line-height:1.45;margin-bottom:24px;max-width:560px}

/* STALL OPTION TILES */
.stall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stall-tile{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:18px 12px 14px;cursor:pointer;text-align:center;transition:border-color .17s,background .17s,transform .12s;position:relative;overflow:hidden;user-select:none}
.stall-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gold-glow),transparent 60%);opacity:0;transition:opacity .17s;pointer-events:none}
.stall-tile:hover{border-color:var(--gold-border);transform:translateY(-1px)}
.stall-tile:hover::after,.stall-tile.sel::after{opacity:1}
.stall-tile.sel{border-color:var(--gold);background:var(--s3)}
.st-num{font-size:36px;font-weight:400;color:var(--gold);font-family:var(--mono);letter-spacing:-.03em;line-height:1;margin-bottom:4px}
.stall-tile:not(.sel) .st-num{color:var(--text)}
.st-kw{font-size:0.72rem;font-family:var(--mono);color:var(--muted);letter-spacing:.04em}
.stall-tile.sel .st-kw{color:var(--gold-dim)}
@media(max-width:600px){.stall-grid{grid-template-columns:repeat(3,1fr)}}

/* CHOICE CARDS */
.choices{display:flex;flex-direction:column;gap:7px}
.choice{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .17s,background .17s,transform .12s;position:relative;overflow:hidden;user-select:none}
.choice::after{content:'';position:absolute;inset:0;background:linear-gradient(130deg,var(--gold-glow),transparent 55%);opacity:0;transition:opacity .17s;pointer-events:none}
.choice:hover{border-color:var(--gold-border);transform:translateY(-1px)}
.choice:hover::after,.choice.sel::after{opacity:1}
.choice.sel{border-color:var(--gold);background:var(--s3)}
.ck{width:22px;height:22px;min-width:22px;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--muted);background:var(--s3);transition:all .17s;margin-top:1px;flex-shrink:0;position:relative;z-index:1}
.choice.sel .ck{background:var(--gold);border-color:var(--gold);color:#09080A;font-weight:700}
.cb{flex:1;position:relative;z-index:1}
.ct{font-size:1.05rem;font-weight:400;color:var(--text);line-height:1.3;margin-bottom:2px}
.cd{font-size:0.88rem;color:var(--muted);line-height:1.4}
.c-tag{display:inline-block;margin-top:6px;font-size:0.72rem;font-family:var(--mono);letter-spacing:.05em;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.choice.sel .c-tag{border-color:var(--gold-border);color:var(--gold)}

/* FORM FIELD */
.field{margin-top:18px;margin-bottom:12px}
.field label{display:block;font-size:0.78rem;font-weight:400;color:var(--dim);margin-bottom:5px;letter-spacing:.02em;text-transform:uppercase}
input[type=text],textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:1rem;font-family:var(--font);color:var(--text);outline:none;transition:border-color .17s,box-shadow .17s;appearance:none;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px var(--gold-glow)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:110px;line-height:1.6}
.ferr{font-size:0.78rem;color:#ff7070;margin-top:4px;display:none}
input.inv,textarea.inv{border-color:#ff7070!important}

/* CTA */
.cta-row{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--r);font-size:0.98rem;font-family:var(--font);font-weight:400;cursor:pointer;border:none;transition:all .17s;text-decoration:none;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-primary{background:var(--gold);color:#09080A}
.btn-primary:hover{background:#ffc93c;box-shadow:0 0 18px rgba(248,185,24,.28)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold-border);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:0.82rem}

/* FOOTER */
footer{padding:13px 36px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--s3);transition:all .3s}
.dot.on{background:var(--gold);box-shadow:0 0 5px rgba(248,185,24,.6)}
.dot.done{background:var(--gold-dim);opacity:.55;cursor:pointer}
.dot.done:hover{opacity:1;transform:scale(1.4)}
.foot-hint{font-size:0.78rem;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
kbd{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--border);border-radius:3px;font-size:9px;font-family:var(--mono);color:var(--muted)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1a1015;border:1px solid rgba(255,100,100,.35);border-radius:9px;padding:10px 18px;font-size:13px;color:#ff8888;z-index:999;font-family:var(--font);box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* SITE TAGS */
.site-tag{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:4px 10px 4px 8px;font-size:0.85rem;color:var(--text);margin:3px 3px 3px 0}
.site-tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;line-height:1;transition:color .15s}
.site-tag button:hover{color:var(--gold)}
.site-tag-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;flex-shrink:0;box-shadow:0 0 5px rgba(74,222,128,0.5)}
.add-spinner{display:inline-block;width:11px;height:11px;border:1.5px solid rgba(255,255,255,0.2);border-top-color:var(--text);border-radius:50%;animation:hex-spin .6s linear infinite;vertical-align:middle}
#add-btn:disabled{opacity:0.6;cursor:not-allowed}
.addr-wrap{position:relative;width:100%}
.addr-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--s2);border:1px solid var(--gold-border);border-radius:var(--r);z-index:200;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4)}.addr-suggestions:empty{display:none}
.addr-suggestion{padding:10px 14px;font-size:0.9rem;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.addr-suggestion:last-child{border-bottom:none}
.addr-suggestion:hover,.addr-suggestion.active{background:var(--s3)}
.addr-suggestion em{color:var(--gold);font-style:normal}
.addr-loading{padding:10px 14px;font-size:0.82rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.addr-none{padding:10px 14px;font-size:0.82rem;color:#ff7070}
.site-tags-wrap{display:flex;flex-wrap:wrap;margin-top:10px;min-height:20px}
.upload-zone{border:1px dashed var(--border);border-radius:var(--r);padding:14px 18px;cursor:pointer;transition:all .17s;text-align:center;font-size:0.88rem;color:var(--muted)}
.upload-zone:hover{border-color:var(--gold-border);color:var(--text)}
.upload-zone input{display:none}

/* QUOTE */
#quote-page{display:none;height:100vh;overflow-y:auto;background:var(--bg)}
#quote-page.on{display:block}
.q-wrap{max-width:820px;margin:0 auto;padding:52px 36px 80px}
.q-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:40px;gap:20px}
.q-meta{text-align:right}
.q-id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:3px}
.q-date{font-size:1rem;color:var(--dim)}
.q-badge{display:inline-block;margin-top:10px;background:var(--gold-glow);border:1px solid var(--gold-border);border-radius:99px;padding:4px 10px;font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:.07em}
.q-title{font-size:28px;font-weight:400;letter-spacing:-.03em;margin-bottom:4px}
.q-subtitle{font-size:0.95rem;color:var(--muted)}
.q-sec{margin-bottom:24px}
.q-sec-title{font-size:0.75rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.q-sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.q-table{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.q-row{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 17px;border-bottom:1px solid var(--border);gap:12px}
.q-row:last-child{border-bottom:none}
.q-row-name{font-size:0.95rem;color:var(--dim)}
.q-price{font-family:var(--mono);font-size:0.95rem;color:var(--text);white-space:nowrap;flex-shrink:0}
.fee-hero{background:var(--s2);border:1px solid var(--gold-border);border-radius:var(--r);padding:30px 30px 26px;position:relative;overflow:hidden;margin-bottom:10px}
.fee-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 120%,rgba(248,185,24,.09) 0%,transparent 70%);pointer-events:none}
.fee-hero-eyebrow{font-size:0.72rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.fee-hero-amount{font-size:62px;font-weight:400;color:var(--gold);font-family:var(--mono);letter-spacing:-.04em;line-height:1}
.fee-hero-per{font-size:0.95rem;color:var(--dim);margin-top:6px}
.fee-hero-sub{font-size:0.78rem;font-family:var(--mono);color:var(--muted);margin-top:5px}
.metric-strip{display:grid;gap:8px;margin-bottom:10px}
.metric-strip.cols-2{grid-template-columns:1fr 1fr}
.metric-strip.cols-3{grid-template-columns:repeat(3,1fr)}
.metric-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:0.68rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.metric-val{font-size:1.15rem;font-weight:400;color:var(--text);font-family:var(--mono)}
.metric-sub{font-size:0.73rem;color:var(--muted);margin-top:2px}
.data-table{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;font-family:var(--mono);font-size:0.84rem}
.dt-head{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:0.68rem;letter-spacing:.06em;text-transform:uppercase;display:grid}
.dt-row{padding:7px 14px;border-bottom:1px solid var(--border);color:var(--text);display:grid}
.dt-row:last-child{border-bottom:none}
.dt-total{padding:9px 14px;border-top:1px solid var(--gold-border);color:var(--gold);display:grid}
.port-cols{grid-template-columns:2fr 1fr 1fr 1fr 80px}
.opex-cols{grid-template-columns:50px 1fr 1fr 1fr 70px}
.inc-list{display:flex;flex-direction:column;gap:5px}
.inc-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r)}
.inc-ck{color:var(--gold);flex-shrink:0;margin-top:1px}
.inc-title{font-size:0.95rem;color:var(--text)}
.inc-sub{font-size:0.78rem;color:var(--muted);margin-top:2px}
.q-actions{display:flex;gap:10px;padding-top:22px;border-top:1px solid var(--border)}
.q-disclaimer{margin-top:16px;font-size:0.7rem;color:var(--muted);line-height:1.7;font-family:var(--mono)}

@media(max-width:820px){
  header,footer{padding:14px 18px}
  .stage{padding:18px 16px}
  .prog-track{width:160px}
  .q-wrap{padding:28px 16px 60px}
  .q-head{flex-direction:column}
  .q-meta{text-align:left}
  .metric-strip.cols-3{grid-template-columns:1fr 1fr}
  .port-cols{grid-template-columns:2fr 1fr 1fr}
  .port-cols .hide-sm{display:none}
  .opex-cols{grid-template-columns:44px 1fr 1fr}
  .opex-cols .hide-sm{display:none}
}
</style>

<script>
document.getElementById('hdr-logo').innerHTML = EE_SVG;

// ── H3 HEXAGON LOOKUP ────────────────────────────────────────
let HEX_LOOKUP = null;

// ── LOADING OVERLAY ──────────────────────────────────────────
(function injectLoader() {
  const style = document.createElement('style');
  style.textContent = `
    #hex-loader {
      position:fixed;inset:0;z-index:9999;
      background:var(--bg);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      transition:opacity .4s ease;
    }
    #hex-loader.fade-out { opacity:0; pointer-events:none; }
    .hex-spinner {
      width:40px;height:40px;
      border:2px solid rgba(248,185,24,0.15);
      border-top-color:var(--gold);
      border-radius:50%;
      animation:hex-spin .75s linear infinite;
      box-shadow:0 0 12px rgba(248,185,24,0.2);
    }
    @keyframes hex-spin { to { transform:rotate(360deg); } }
    .hex-loader-text {
      font-family:var(--mono,monospace);
      font-size:0.78rem;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--muted,#BEBEC0);
    }
  `;
  document.head.appendChild(style);

  const el = document.createElement('div');
  el.id = 'hex-loader';
  el.innerHTML = '<div class="hex-spinner"></div><div class="hex-loader-text">Loading coverage data…</div>';
  document.body.appendChild(el);
})();

// ── FETCH HEX LOOKUP FROM EXTERNAL JSON ──────────────────────
async function loadHexLookup() {
  const url = 'https://raw.githubusercontent.com/jordanmcon/ev-project-intake/caas/hexagon_lookup.json';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.json();
    // Support both formats:
    //   Legacy (inline): { "hex_id": spd_value, ... }
    //   New file:        { "hexagons": [ { hex_id, daily_sessions, ... }, ... ] }
    if (raw.hexagons && Array.isArray(raw.hexagons)) {
      HEX_LOOKUP = {};
      for (const entry of raw.hexagons) {
        HEX_LOOKUP[entry.hex_id] = entry.daily_sessions;
      }
    } else {
      HEX_LOOKUP = raw;
    }
  } catch (e) {
    console.error('Failed to load hexagon lookup:', e);
    HEX_LOOKUP = {}; // graceful degradation — lookups will return no_data
  } finally {
    const loader = document.getElementById('hex-loader');
    if (loader) {
      loader.classList.add('fade-out');
      setTimeout(() => loader.remove(), 420);
    }
  }
}

// Geocode an address via Nominatim, return H3 index at res 6, look up SPD
// Returns: { spd: number|null, hexId: string|null, status: 'found'|'no_data'|'error' }
async function lookupSPD(address) {
  if (!HEX_LOOKUP) return { spd: null, hexId: null, status: 'error' };
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data || !data.length) return { spd: null, hexId: null, status: 'error' };
    const lat = parseFloat(data[0].lat);
    const lng = parseFloat(data[0].lon);
    const hexId = h3.latLngToCell(lat, lng, 6);
    const spd = HEX_LOOKUP[hexId] ?? null;
    return { spd, hexId, status: spd !== null ? 'found' : 'no_data' };
  } catch(e) {
    return { spd: null, hexId: null, status: 'error' };
  }
}

// Geocode all sites, return array of { address, spd, status }
async function lookupAllSites(sites) {
  const results = [];
  for (const addr of sites) {
    const r = await lookupSPD(addr);
    results.push({ address: addr, ...r });
    await new Promise(resolve => setTimeout(resolve, 200)); // Nominatim rate limit
  }
  return results;
}

// ── STATE ────────────────────────────────────────────────────
const S = {
  sites:   [],
  product: null,   // 'base' | 're400'
  stalls:  null,   // set by tile selection
  quoteId: '', quoteDate: '',
};

const FIXED_IRR = 12.0;  // not exposed to user

// ── PRICING MODEL ────────────────────────────────────────────
// Fees snap directly to the reference table (EE___MN8_CaaS_Calculator XLSX,
// "Indicative CaaS Fee" sheet, IRR = 12%). Stall counts > 8 display the
// 8-stall fee with a "+" suffix to indicate the floor, not a firm price.
//
// TABLE_FEES[product][stalls] = { noLcfs, lcfs }  (annual $)
// Stall counts supported: 4, 6, 8. Anything above 8 → capped at 8.
const TABLE_FEES = {
  re400: {
    4: { noLcfs: 187000, lcfs: 117000 },
    6: { noLcfs: 258000, lcfs: 154000 },
    8: { noLcfs: 329000, lcfs: 191000 },
  },
  base: {
    4: { noLcfs: 116000, lcfs:  76000 },
    6: { noLcfs: 160000, lcfs: 101000 },
    8: { noLcfs: 197000, lcfs: 118000 },
  },
};
const TABLE_STALLS = [4, 6, 8]; // supported stall counts in the table

// Product display names and per-port kW
const PRODUCT_META = {
  base:  { label: 'Base Station', kw: 200 },
  re400: { label: 'RE400',        kw: 400 },
};

// ── LCFS ─────────────────────────────────────────────────────
const LCFS_STATES = ['CA', 'OR', 'WA', 'CALIFORNIA', 'OREGON', 'WASHINGTON'];
const LCFS_RATE   = 0.12;  // $/kWh delivered

function isLCFSEligible(address) {
  const upper = address.toUpperCase();
  return LCFS_STATES.some(s => new RegExp('\\b' + s + '\\b').test(upper));
}

// Compute NPV of 10-yr LCFS credits for one site.
// Credit = LCFS_RATE × 35 kWh/session × SPD × 365, growing 10%/yr.
// spd = Year-1 sessions/day; r = discount rate (decimal)
function lcfsCreditNPV(spd, r) {
  let npv = 0;
  for (let t = 1; t <= 10; t++) {
    const spdYr  = spd * Math.pow(1.10, t - 1);
    const annual = LCFS_RATE * 35 * spdYr * 365;
    npv += annual / Math.pow(1 + r, t);
  }
  return npv;
}

// Year-1 annual LCFS credit for display purposes
function lcfsCreditYear1(spd) {
  return LCFS_RATE * 35 * spd * 365;
}

// ── FEE LOOKUP ENGINE ────────────────────────────────────────
// Snaps stall count to the nearest supported table entry (≤ 8).
// Returns fee object with a `capped` flag when stalls > 8.
function lookupFee(product, stalls, lcfsEligible) {
  const capped  = stalls > 8;
  const snapKey = capped ? 8 : (TABLE_STALLS.includes(stalls) ? stalls : 8);
  const row     = TABLE_FEES[product][snapKey];
  const annual  = lcfsEligible ? row.lcfs : row.noLcfs;
  return {
    annual,
    monthly:   annual / 12,
    total10:   annual * 10,
    lcfs:      lcfsEligible,
    capped,
    snapStalls: snapKey,
  };
}

// Backwards-compat alias used in a few places
function calcFee(product, stalls, _irr, creditNPV) {
  const lcfsEligible = creditNPV > 0;
  return lookupFee(product, stalls, lcfsEligible);
}

function fmt(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
// Format with optional "+" suffix for capped (above-table) stall counts
function fmtFee(n, capped) { return fmt(n) + (capped ? '+' : ''); }

// ── SITE MANAGEMENT ──────────────────────────────────────────

// ── ADDRESS AUTOCOMPLETE ─────────────────────────────────────
// All Nominatim calls are US-only via countrycodes=us
const NOMINATIM = 'https://nominatim.openstreetmap.org';
let _acTimer = null;      // debounce handle
let _acActive = -1;       // keyboard-highlighted suggestion index
let _acResults = [];      // current suggestion objects [{label, raw}]
let _acAbort = null;      // AbortController for in-flight suggest fetch

function nominatimUrl(endpoint, params) {
  const base = `${NOMINATIM}/${endpoint}?format=json&countrycodes=us&accept-language=en&`;
  return base + Object.entries(params).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
}

function buildLabel(result) {
  const a = result.address || {};
  const parts = [
    a.house_number && a.road ? `${a.house_number} ${a.road}` : (a.road || null),
    a.city || a.town || a.village || a.municipality || null,
    a.state || null,
    a.postcode || null,
  ].filter(Boolean);
  return parts.length >= 2 ? parts.join(', ') : result.display_name;
}

function closeSuggestions() {
  const box = document.getElementById('addr-suggestions');
  if (box) box.innerHTML = '';
  _acActive = -1;
  _acResults = [];
}

function renderSuggestions(items, query) {
  const box = document.getElementById('addr-suggestions');
  if (!box) return;
  _acResults = items;
  _acActive = -1;
  if (!items.length) {
    box.innerHTML = '<div class="addr-none">No US addresses found — try adding city and state</div>';
    return;
  }
  // Bold the matching portion of the query in each suggestion
  const esc = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(${esc})`, 'gi');
  box.innerHTML = items.map((item, i) => {
    const highlighted = item.label.replace(re, '<em>$1</em>');
    return `<div class="addr-suggestion" data-i="${i}" onmousedown="pickSuggestion(${i})">${highlighted}</div>`;
  }).join('');
}

function pickSuggestion(i) {
  const item = _acResults[i];
  if (!item) return;
  closeSuggestions();
  if (!S.sites.includes(item.label)) {
    S.sites.push(item.label);
    renderSiteTags();
  }
  const inp = document.getElementById('siteInput');
  if (inp) inp.value = '';
  document.getElementById('e-verify') && (document.getElementById('e-verify').style.display = 'none');
}

async function fetchSuggestions(query) {
  if (_acAbort) _acAbort.abort();
  _acAbort = new AbortController();
  const box = document.getElementById('addr-suggestions');
  if (box) box.innerHTML = '<div class="addr-loading">Searching…</div>';
  try {
    const url = nominatimUrl('search', { q: query, limit: 5, addressdetails: 1 });
    const res = await fetch(url, {
      signal: _acAbort.signal,
      headers: { 'Accept-Language': 'en' }
    });
    const data = await res.json();
    // Filter to US results only (belt-and-suspenders on top of countrycodes param)
    const us = (data || []).filter(r => (r.address || {}).country_code === 'us');
    renderSuggestions(us.map(r => ({ label: buildLabel(r), raw: r })), query);
  } catch(e) {
    if (e.name !== 'AbortError' && box) box.innerHTML = '';
  }
}

function onSiteInput(e) {
  const val = e.target.value.trim();
  clearTimeout(_acTimer);
  if (val.length < 4) { closeSuggestions(); return; }
  _acTimer = setTimeout(() => fetchSuggestions(val), 350); // debounce 350ms
}

function onSiteKeydown(e) {
  const box = document.getElementById('addr-suggestions');
  const items = box ? box.querySelectorAll('.addr-suggestion') : [];

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acActive = Math.min(_acActive + 1, items.length - 1);
    items.forEach((el, i) => el.classList.toggle('active', i === _acActive));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acActive = Math.max(_acActive - 1, -1);
    items.forEach((el, i) => el.classList.toggle('active', i === _acActive));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (_acActive >= 0 && _acResults[_acActive]) {
      pickSuggestion(_acActive);
    } else {
      addSiteFromInput();
    }
  } else if (e.key === 'Escape') {
    closeSuggestions();
  }
}

// ── VERIFY & ADD ─────────────────────────────────────────────
// Used when user types freely and hits Add without picking a suggestion.
// Verifies the raw text against Nominatim before committing, US-only.
async function verifyAddress(raw) {
  try {
    const url = nominatimUrl('search', { q: raw, limit: 1, addressdetails: 1 });
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data || !data.length) return null;
    const r = data[0];
    if ((r.address || {}).country_code !== 'us') return null;
    return buildLabel(r);
  } catch(e) {
    return null;
  }
}

function renderSiteTags() {
  const wrap = document.getElementById('site-tags'); if (!wrap) return;
  wrap.innerHTML = S.sites.map((s,i) => `
    <span class="site-tag">
      <span class="site-tag-dot"></span>${s}
      <button onclick="removeSite(${i})" title="Remove">✕</button>
    </span>`).join('');
  const counter = document.getElementById('site-count');
  if (counter) counter.textContent = S.sites.length ? `${S.sites.length} site${S.sites.length>1?'s':''}` : '';
}

function setAddBtn(state, msg) {
  const btn = document.getElementById('add-btn');
  const err = document.getElementById('e-verify');
  if (!btn) return;
  if (state === 'loading') {
    btn.disabled = true;
    btn.innerHTML = '<span class="add-spinner"></span> Verifying…';
  } else {
    btn.disabled = false;
    btn.innerHTML = '+ Add';
  }
  if (err) {
    err.style.display = state === 'error' ? 'block' : 'none';
    if (state === 'error' && msg) err.textContent = msg;
  }
}

async function addSiteFromInput() {
  const inp = document.getElementById('siteInput'); if (!inp) return;
  const val = inp.value.trim();
  if (!val) return;
  closeSuggestions();
  if (S.sites.includes(val)) { inp.value = ''; return; }
  setAddBtn('loading');
  const resolved = await verifyAddress(val);
  if (resolved) {
    if (!S.sites.includes(resolved)) S.sites.push(resolved);
    inp.value = '';
    setAddBtn('idle');
  } else {
    setAddBtn('error', `Could not verify "${val}" as a US address — please select from the suggestions or check the address.`);
  }
  renderSiteTags();
}

// Keep addSitesFromText as alias for backward compat (CSV flow, slide valid() hook)
async function addSitesFromText() { await addSiteFromInput(); }

function removeSite(i) { S.sites.splice(i,1); renderSiteTags(); }

function handleCSV(file) {
  const reader = new FileReader();
  reader.onload = async e => {
    const lines = e.target.result.split('\n').map(l => l.replace(/^["']|["']$/g,'').trim()).filter(Boolean);
    const start = /address|site|location/i.test(lines[0]) ? 1 : 0;
    const toAdd = lines.slice(start).filter(l => !S.sites.includes(l));
    if (!toAdd.length) return;

    setAddBtn('loading');
    const failed = [];
    for (const line of toAdd) {
      const resolved = await verifyAddress(line);
      if (resolved) {
        if (!S.sites.includes(resolved)) S.sites.push(resolved);
      } else {
        failed.push(line);
      }
      await new Promise(r => setTimeout(r, 200)); // Nominatim rate limit
    }
    if (failed.length) {
      setAddBtn('error', `Could not verify ${failed.length} address${failed.length>1?'es':''} from CSV — they were not added. Non-US addresses are not supported.`);
    } else {
      setAddBtn('idle');
    }
    renderSiteTags();
  };
  reader.readAsText(file);
}

  if (hint) hint.innerHTML = `<span style="color:var(--gold);">${n} stalls selected</span> · ${n} × ${meta.label} · ${meta.kw} kW per port`;
}

let cur = 0;
function renderProgress() {
  const n = SLIDES.length, pct = Math.round((cur+1)/n*100);
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-lbl').textContent = `Step ${cur} of ${n-1}`;
  document.getElementById('dots').innerHTML = SLIDES.map((_,i) =>
    `<div class="dot ${i===cur?'on':i<cur?'done':''}" ${i<cur?`onclick="jumpTo(${i})" style="cursor:pointer"`:''} ></div>`
  ).join('');
}
function render() {
  const stage = document.getElementById('stage');
  const old = stage.querySelector('.slide');
  if (old) { old.classList.add('out'); setTimeout(()=>{ if(old.parentNode) old.parentNode.removeChild(old); }, 250); }
  const div = document.createElement('div'); div.className = 'slide'; div.innerHTML = SLIDES[cur].render();
  setTimeout(() => stage.appendChild(div), old ? 50 : 0);
  renderProgress();
  if (SLIDES[cur].onEnter) SLIDES[cur].onEnter();
}
function next()    { if (!SLIDES[cur].valid()) return; if (cur < SLIDES.length-1) { cur++; render(); } }
function prev()    { if (cur > 0) { cur--; render(); } }
function jumpTo(i) { if (i < cur) { cur=i; render(); } }

function pick(key, val, el) {
  S[key] = val;
  el.closest('.choices').querySelectorAll('.choice').forEach((c,i) => {
    c.classList.toggle('sel', c===el);
    c.querySelector('.ck').textContent = String.fromCharCode(65+i);
  });
}

function pickProduct(val, el) {
  S.product = val;
  // Reset stalls when product changes so price stays consistent
  S.stalls = null;
  el.closest('.choices').querySelectorAll('.choice').forEach((c,i) => {
    c.classList.toggle('sel', c===el);
    const ck = c.querySelector('.ck');
    if (ck) ck.textContent = String.fromCharCode(65+i);
  });
}

let _tt;
function toast(msg) {
  clearTimeout(_tt); let t=document.querySelector('.toast'); if(t) t.remove();
  t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  _tt=setTimeout(()=>t&&t.remove(), 3000);
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) {
    if (document.getElementById('quote-page').classList.contains('on')) return;
    next();
  }
});

      <p style="font-size:0.7rem;color:var(--muted);margin-top:7px;font-family:var(--mono);">Utilization estimates are derived from Paren EV Sessions data. Actual results will vary.</p>

    <!-- STATION DETAILS -->

        <div class="q-row"><span class="q-row-name">Number of sites</span><span class="q-price">${n}</span></div>

    <!-- INCLUSIONS -->
    <div class="q-sec">

      <div class="inc-list">
        ${[
          ['EV charging strategy',              'Pricing strategy, operational strategy, and operations management'], 
          ['Hardware procurement & installation', `${productMeta.label} charger equipment, electrical, and permitting coordination.`],
          ['Full-term operations & maintenance',  'Preventative and corrective maintenance included for 10 years.'],
          ['HaloAI on-charger software',          'Driver support, remote diagnostics, and retail experience features.'],

        ].map(([t,s]) => `

    <!-- P&L CTA -->

  qp.scrollTop = 0;

// ── P&L ENGINE ───────────────────────────────────────────────

let PL_STATE = { chargingPrice: 0.50, electricityPrice: 0.12 };
let PL_DATA  = null;   // { spd, caasAnnual, years[] }

function computePL(spd, caasAnnual, chargingPrice, electricityPrice) {
  const kwhPerSession = 35;  // 35 kWh per session
  const years = [];
  let cumulative = 0;
  let breakevenYear = null;
  for (let yr = 1; yr <= 10; yr++) {
    const spdYr      = spd * Math.pow(1.10, yr - 1);   // 10% YoY growth
    const sessions   = spdYr * 365;
    const revenue    = sessions * kwhPerSession * chargingPrice;
    const elecCost   = sessions * kwhPerSession * electricityPrice;
    const caasFee    = caasAnnual;
    const netProfit  = revenue - elecCost - caasFee;
    cumulative      += netProfit;
    if (breakevenYear === null && cumulative > 0) breakevenYear = yr;
    years.push({ yr, spdYr, sessions, revenue, elecCost, caasFee, netProfit, cumulative });
  }
  const total10Net = years[9].cumulative;
  // IRR: discount rate where NPV of net cash flows = 0
  // Using Newton's method
  const flows = years.map(y => y.netProfit);
  function npv(r) {
    return flows.reduce((sum, cf, i) => sum + cf / Math.pow(1 + r, i + 1), 0);
  }
  let irr = null;
  if (flows.some(f => f > 0) && flows.some(f => f < 0)) {
    let r = 0.15;
    for (let i = 0; i < 100; i++) {
      const f  = npv(r);
      const df = flows.reduce((sum, cf, i) => sum - (i + 1) * cf / Math.pow(1 + r, i + 2), 0);
      if (Math.abs(df) < 1e-10) break;
      const rNew = r - f / df;
      if (Math.abs(rNew - r) < 1e-8) { r = rNew; break; }
      r = rNew;
    }
    if (r > -1 && r < 10) irr = r;
  } else if (flows.every(f => f > 0)) {
    irr = Infinity;  // always profitable
  }
  return { years, total10Net, breakevenYear, irr };
}

function renderPL() {
  if (!PL_DATA) return;
  const { spd, caasAnnual } = PL_DATA;
  const cp = PL_STATE.chargingPrice;
  const ep = PL_STATE.electricityPrice;
  const result = computePL(spd, caasAnnual, cp, ep);
  const { years, total10Net, breakevenYear, irr } = result;

  const irrStr = irr === null ? 'N/A'
               : irr === Infinity ? '> 1000%'
               : (irr * 100).toFixed(1) + '%';
  const bkStr  = breakevenYear ? 'Year ' + breakevenYear : 'Not in 10 yrs';

  const totalRevenue  = years.reduce((a, y) => a + y.revenue,  0);
  const totalElec     = years.reduce((a, y) => a + y.elecCost, 0);
  const totalCaaS     = years.reduce((a, y) => a + y.caasFee,  0);

  // Flipped table: rows = line items, columns = years + total
  const colW = `repeat(${years.length + 2}, 1fr)`;
  const yrHeaders = years.map(y => `<span style="text-align:right;">Yr ${y.yr}</span>`).join('');
  const mkRow = (label, vals, totalVal, style='', isNeg=false) => {
    const cells = vals.map((v,i) => {
      const col = style || (isNeg ? 'color:#ff8888;' : '');
      return `<span style="text-align:right;${col}">${fmtK(v)}</span>`;
    }).join('');
    const totStyle = style || (isNeg ? 'color:#ff8888;' : '');
    return `<div style="display:grid;grid-template-columns:${colW};gap:2px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);">
      <span style="font-size:0.8rem;color:var(--dim);">${label}</span>
      ${cells}
      <span style="text-align:right;font-weight:500;${totStyle}">${fmtK(totalVal)}</span>
    </div>`;
  };

  const netColors = years.map(y => `color:${y.netProfit>=0?'var(--gold)':'#ff7070'};font-weight:500;`);
  const netCells  = years.map((y,i) => `<span style="text-align:right;${netColors[i]}">${fmtK(y.netProfit)}</span>`).join('');
  const cumColors = years.map(y => `color:${y.cumulative>=0?'var(--gold)':'var(--muted)'};font-family:var(--mono);`);
  const cumCells  = years.map((y,i) => `<span style="text-align:right;${cumColors[i]}">${fmtK(y.cumulative)}</span>`).join('');
  const total10NetStyle = total10Net>=0?'color:var(--gold);font-weight:600;':'color:#ff7070;font-weight:600;';

  const flippedTable = `
    <div class="dt-head" style="display:grid;grid-template-columns:${colW};gap:2px;padding:8px 12px;font-size:0.67rem;letter-spacing:.06em;">
      <span>Line item</span>${yrHeaders}<span style="text-align:right;">10-Yr total</span>
    </div>
    ${mkRow('Charging revenue', years.map(y=>y.revenue), totalRevenue)}
    ${mkRow('Electricity cost', years.map(y=>y.elecCost), totalElec, 'color:#ff8888;')}
    ${mkRow('CaaS fee', years.map(y=>y.caasFee), totalCaaS, 'color:#ff8888;')}
    <div style="display:grid;grid-template-columns:${colW};gap:2px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--border);">
      <span style="font-size:0.8rem;color:var(--dim);font-weight:600;">Net profit</span>
      ${netCells}
      <span style="text-align:right;${total10NetStyle}">${fmtK(total10Net)}</span>
    </div>
    <div style="display:grid;grid-template-columns:${colW};gap:2px;align-items:center;padding:7px 12px;">
      <span style="font-size:0.8rem;color:var(--muted);font-style:italic;">Cumulative</span>
      ${cumCells}
      <span></span>
    </div>
  `;

  document.getElementById('pl-section').innerHTML = `
    <div style="margin-bottom:24px;">

      <!-- Sliders -->
      <div class="q-sec" style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:20px 22px;margin-bottom:16px;">
        <div class="q-sec-title" style="margin-bottom:14px;">P&amp;L assumptions</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
          <div>
            <label style="display:flex;justify-content:space-between;font-size:0.78rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">
              <span>Charging price / kWh</span>
              <span id="cp-val" style="color:var(--gold);">$${cp.toFixed(2)}</span>
            </label>
            <input type="range" id="cp-slider" min="0.30" max="0.70" step="0.01" value="${cp}"
              style="width:100%;accent-color:var(--gold);"
              oninput="PL_STATE.chargingPrice=parseFloat(this.value);document.getElementById('cp-val').textContent='$'+parseFloat(this.value).toFixed(2);renderPL();">
            <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);font-family:var(--mono);margin-top:3px;"><span>$0.30</span><span>$0.70</span></div>
          </div>
          <div>
            <label style="display:flex;justify-content:space-between;font-size:0.78rem;font-family:var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">
              <span>Electricity cost / kWh</span>
              <span id="ep-val" style="color:var(--gold);">$${ep.toFixed(2)}</span>
            </label>
            <input type="range" id="ep-slider" min="0.05" max="0.30" step="0.01" value="${ep}"
              style="width:100%;accent-color:var(--gold);"
              oninput="PL_STATE.electricityPrice=parseFloat(this.value);document.getElementById('ep-val').textContent='$'+parseFloat(this.value).toFixed(2);renderPL();">
            <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:var(--muted);font-family:var(--mono);margin-top:3px;"><span>$0.05</span><span>$0.30</span></div>
          </div>
        </div>
        <div style="margin-top:14px;font-size:0.72rem;color:var(--muted);font-family:var(--mono);">
          35 kWh/session · SPD grows 10% YoY · portfolio SPD total: ${spd.toFixed(1)}
        </div>
      </div>

      <!-- Summary metrics -->
      <div class="metric-strip cols-3" style="margin-bottom:16px;">
        <div class="metric-card" style="border-color:${total10Net >= 0 ? 'var(--gold-border)' : 'rgba(255,100,100,0.3)'};">
          <div class="metric-label">10-yr net profit</div>
          <div class="metric-val" style="color:${total10Net >= 0 ? 'var(--gold)' : '#ff7070'};">${fmt(total10Net)}</div>
          <div class="metric-sub">After electricity + CaaS fees</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Breakeven year</div>
          <div class="metric-val">${bkStr}</div>
          <div class="metric-sub">First year cumulative profit &gt; 0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">IRR (10-yr)</div>
          <div class="metric-val">${irrStr}</div>
          <div class="metric-sub">On net charging cash flows</div>
        </div>
      </div>

      <!-- Chart -->
      <div class="q-sec-title" style="margin-bottom:12px;">Net profit by year</div>
      <div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:18px 18px 10px;">
        <canvas id="pl-chart" style="width:100%;max-height:220px;"></canvas>
      </div>

      <!-- Flipped Table: rows = line items, columns = years -->
      <div class="q-sec-title" style="margin-top:20px;margin-bottom:8px;">Year-by-year P&amp;L</div>
      <div style="overflow-x:auto;">
        <div class="data-table" style="min-width:740px;">
          ${flippedTable}
        </div>
      </div>
      <p style="font-size:0.7rem;color:var(--muted);margin-top:8px;font-family:var(--mono);">Revenue and cost projections are illustrative. Actual results will vary based on local conditions.</p>
    </div>
  `;

  // Draw chart after DOM is ready
  requestAnimationFrame(() => {
    const ctx = document.getElementById('pl-chart');
    if (!ctx) return;
    if (window._plChart) window._plChart.destroy();
    const netProfits = years.map(y => Math.round(y.netProfit));
    const colors = netProfits.map(v => v >= 0 ? 'rgba(248,185,24,0.85)' : 'rgba(255,100,100,0.75)');
    const borderColors = netProfits.map(v => v >= 0 ? '#f8b918' : '#ff6464');
    window._plChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years.map(y => 'Yr ' + y.yr),
        datasets: [{
          label: 'Net Profit',
          data: netProfits,
          backgroundColor: colors,
          borderColor: borderColors,
          borderWidth: 1,
          borderRadius: 3,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        aspectRatio: 3.5,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ' $' + Math.abs(ctx.parsed.y).toLocaleString() + (ctx.parsed.y < 0 ? ' (loss)' : '')
            },
            backgroundColor: '#1e1e22',
            borderColor: '#444',
            borderWidth: 1,
            titleColor: '#ccc',
            bodyColor: '#f8b918',
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#888', font: { family: 'monospace', size: 11 } }
          },
          y: {
            grid: { color: 'rgba(255,255,255,0.06)' },
            ticks: {
              color: '#888',
              font: { family: 'monospace', size: 11 },
              callback: v => '$' + (Math.abs(v) >= 1000000 ? (v/1000000).toFixed(1)+'M' : Math.abs(v) >= 1000 ? (v/1000).toFixed(0)+'K' : v)
            },
            border: { dash: [3,3] }
          }
        }
      }
    });
  });
}

function fmtK(n) {
  if (Math.abs(n) >= 1000000) return (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n/1000)/1000).toFixed(1) + 'M';
  if (Math.abs(n) >= 1000)    return (n < 0 ? '-' : '') + '$' + Math.abs(Math.round(n/1000)) + 'K';
  return fmt(n);
}

function showPL() {
  // Get SPD: use first site, portfolio average, or fallback to 5
  let spd = 5;
  if (window._siteResults && window._siteResults.length) {
    const found = window._siteResults.filter(s => s.status === 'found');
    if (found.length) spd = found.reduce((a, s) => a + s.spd, 0);
  }
  const caasAnnual = (window._siteResults || []).reduce((a, s) => a + (s.fee?.annual || 0), 0);

  PL_DATA = { spd, caasAnnual };
  document.getElementById('pl-cta').style.display = 'none';
  document.getElementById('pl-section').style.display = 'block';
  renderPL();
  document.getElementById('pl-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function backToForm() {
  document.getElementById('quote-page').classList.remove('on');
  document.getElementById('app').classList.remove('gone');
}

function exportPDF() {
  html2pdf().set({
    margin: [10,10],
    filename: `EE-CaaS-Quote-${S.quoteId}.pdf`,
    image: {type:'jpeg', quality:0.97},
    html2canvas: {scale:2, useCORS:true, backgroundColor:'#28282D'},
    jsPDF: {unit:'mm', format:'a4', orientation:'portrait'}
  }).from(document.getElementById('q-wrap')).save();
}

loadHexLookup().then(() => render());
