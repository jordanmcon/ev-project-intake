<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electric Era — Charging as a Service</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>
<style>
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Light.woff2') format('woff2'); font-weight:300; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Regular.woff2') format('woff2'); font-weight:400; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Medium.woff2') format('woff2'); font-weight:500; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-SemiBold.woff2') format('woff2'); font-weight:600; font-display:swap; }
@font-face { font-family:'Haffer'; src:url('fonts/Haffer-Bold.woff2') format('woff2'); font-weight:700; font-display:swap; }
</style>
<style>
:root {
  --gold:#F8B918;--gold-dim:#c99610;--gold-glow:rgba(248,185,24,0.13);--gold-border:rgba(248,185,24,0.36);
  --bg:#28282D;--s1:#111013;--s2:#171519;--s3:#1E1C21;
  --border:rgba(255,255,255,0.07);--text:#FFFFFF;--muted:#D4D4D5;--dim:#BEBEC0;
  --r:11px;--font:'Haffer','DM Sans',sans-serif;--mono:'Haffer','DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);font-weight:300;font-size:1.02rem;background:var(--bg);color:var(--text);overflow:hidden}
#app{height:100vh;display:flex;flex-direction:column}
#app.gone{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 36px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;text-decoration:none}
.prog-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;flex:1}
.prog-lbl{font-size:11px;font-family:var(--mono);letter-spacing:.07em;color:var(--muted)}
.prog-track{width:260px;height:2px;background:var(--s3);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:var(--gold);border-radius:99px;transition:width .55s cubic-bezier(.4,0,.2,1);box-shadow:0 0 7px rgba(248,185,24,.55)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 36px;overflow-y:auto;overflow-x:hidden;position:relative}
.stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 50% at 50% 105%,rgba(248,185,24,.05) 0%,transparent 70%);pointer-events:none}
.slide{width:100%;max-width:900px;animation:sUp .4s cubic-bezier(.4,0,.2,1) both;align-self:flex-start;margin:auto}
.slide.out{animation:sDown .25s cubic-bezier(.4,0,.2,1) both}
@keyframes sUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sDown{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-16px)}}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:0.8rem;letter-spacing:.13em;color:var(--gold);text-transform:uppercase;margin-bottom:13px}
.slide h1{font-size:clamp(26px,3.6vw,36px);font-weight:400;line-height:1.18;letter-spacing:-.025em;margin-bottom:7px}
.slide h1 em{font-style:normal;color:var(--gold)}
.slide .sub{font-size:1rem;color:var(--dim);line-height:1.45;margin-bottom:24px;max-width:560px}

/* STALL OPTION TILES */
.stall-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stall-tile{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:18px 12px 14px;cursor:pointer;text-align:center;transition:border-color .17s,background .17s,transform .12s;position:relative;overflow:hidden;user-select:none}
.stall-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--gold-glow),transparent 60%);opacity:0;transition:opacity .17s;pointer-events:none}
.stall-tile:hover{border-color:var(--gold-border);transform:translateY(-1px)}
.stall-tile:hover::after,.stall-tile.sel::after{opacity:1}
.stall-tile.sel{border-color:var(--gold);background:var(--s3)}
.st-num{font-size:36px;font-weight:400;color:var(--gold);font-family:var(--mono);letter-spacing:-.03em;line-height:1;margin-bottom:4px}
.stall-tile:not(.sel) .st-num{color:var(--text)}
.st-kw{font-size:0.72rem;font-family:var(--mono);color:var(--muted);letter-spacing:.04em}
.stall-tile.sel .st-kw{color:var(--gold-dim)}
@media(max-width:600px){.stall-grid{grid-template-columns:repeat(3,1fr)}}

/* CHOICE CARDS */
.choices{display:flex;flex-direction:column;gap:7px}
.choice{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;transition:border-color .17s,background .17s,transform .12s;position:relative;overflow:hidden;user-select:none}
.choice::after{content:'';position:absolute;inset:0;background:linear-gradient(130deg,var(--gold-glow),transparent 55%);opacity:0;transition:opacity .17s;pointer-events:none}
.choice:hover{border-color:var(--gold-border);transform:translateY(-1px)}
.choice:hover::after,.choice.sel::after{opacity:1}
.choice.sel{border-color:var(--gold);background:var(--s3)}
.ck{width:22px;height:22px;min-width:22px;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--muted);background:var(--s3);transition:all .17s;margin-top:1px;flex-shrink:0;position:relative;z-index:1}
.choice.sel .ck{background:var(--gold);border-color:var(--gold);color:#09080A;font-weight:700}
.cb{flex:1;position:relative;z-index:1}
.ct{font-size:1.05rem;font-weight:400;color:var(--text);line-height:1.3;margin-bottom:2px}
.cd{font-size:0.88rem;color:var(--muted);line-height:1.4}
.c-tag{display:inline-block;margin-top:6px;font-size:0.72rem;font-family:var(--mono);letter-spacing:.05em;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted)}
.choice.sel .c-tag{border-color:var(--gold-border);color:var(--gold)}

/* FORM FIELD */
.field{margin-top:18px;margin-bottom:12px}
.field label{display:block;font-size:0.78rem;font-weight:400;color:var(--dim);margin-bottom:5px;letter-spacing:.02em;text-transform:uppercase}
input[type=text],textarea{width:100%;background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-size:1rem;font-family:var(--font);color:var(--text);outline:none;transition:border-color .17s,box-shadow .17s;appearance:none;resize:vertical}
input:focus,textarea:focus{border-color:var(--gold-border);box-shadow:0 0 0 3px var(--gold-glow)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:110px;line-height:1.6}
.ferr{font-size:0.78rem;color:#ff7070;margin-top:4px;display:none}
input.inv,textarea.inv{border-color:#ff7070!important}

/* CTA */
.cta-row{display:flex;align-items:center;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:var(--r);font-size:0.98rem;font-family:var(--font);font-weight:400;cursor:pointer;border:none;transition:all .17s;text-decoration:none;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-primary{background:var(--gold);color:#09080A}
.btn-primary:hover{background:#ffc93c;box-shadow:0 0 18px rgba(248,185,24,.28)}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold-border);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:0.82rem}

/* FOOTER */
footer{padding:13px 36px;border-top:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.dots{display:flex;gap:5px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--s3);transition:all .3s}
.dot.on{background:var(--gold);box-shadow:0 0 5px rgba(248,185,24,.6)}
.dot.done{background:var(--gold-dim);opacity:.55;cursor:pointer}
.dot.done:hover{opacity:1;transform:scale(1.4)}
.foot-hint{font-size:0.78rem;font-family:var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
kbd{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid var(--border);border-radius:3px;font-size:9px;font-family:var(--mono);color:var(--muted)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1a1015;border:1px solid rgba(255,100,100,.35);border-radius:9px;padding:10px 18px;font-size:13px;color:#ff8888;z-index:999;font-family:var(--font);box-shadow:0 4px 18px rgba(0,0,0,.5);pointer-events:none;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* SITE TAGS */
.site-tag{display:inline-flex;align-items:center;gap:6px;background:var(--s3);border:1px solid var(--border);border-radius:6px;padding:4px 10px 4px 12px;font-size:0.85rem;color:var(--text);margin:3px 3px 3px 0}
.site-tag button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;line-height:1;transition:color .15s}
.site-tag button:hover{color:var(--gold)}
.site-tags-wrap{display:flex;flex-wrap:wrap;margin-top:10px;min-height:20px}
.upload-zone{border:1px dashed var(--border);border-radius:var(--r);padding:14px 18px;cursor:pointer;transition:all .17s;text-align:center;font-size:0.88rem;color:var(--muted)}
.upload-zone:hover{border-color:var(--gold-border);color:var(--text)}
.upload-zone input{display:none}

/* QUOTE */
#quote-page{display:none;height:100vh;overflow-y:auto;background:var(--bg)}
#quote-page.on{display:block}
.q-wrap{max-width:820px;margin:0 auto;padding:52px 36px 80px}
.q-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:40px;gap:20px}
.q-meta{text-align:right}
.q-id{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:3px}
.q-date{font-size:1rem;color:var(--dim)}
.q-badge{display:inline-block;margin-top:10px;background:var(--gold-glow);border:1px solid var(--gold-border);border-radius:99px;padding:4px 10px;font-size:10px;font-family:var(--mono);color:var(--gold);letter-spacing:.07em}
.q-title{font-size:28px;font-weight:400;letter-spacing:-.03em;margin-bottom:4px}
.q-subtitle{font-size:0.95rem;color:var(--muted)}
.q-sec{margin-bottom:24px}
.q-sec-title{font-size:0.75rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:8px}
.q-sec-title::after{content:'';flex:1;height:1px;background:var(--border)}
.q-table{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.q-row{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 17px;border-bottom:1px solid var(--border);gap:12px}
.q-row:last-child{border-bottom:none}
.q-row-name{font-size:0.95rem;color:var(--dim)}
.q-price{font-family:var(--mono);font-size:0.95rem;color:var(--text);white-space:nowrap;flex-shrink:0}
.fee-hero{background:var(--s2);border:1px solid var(--gold-border);border-radius:var(--r);padding:30px 30px 26px;position:relative;overflow:hidden;margin-bottom:10px}
.fee-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 120%,rgba(248,185,24,.09) 0%,transparent 70%);pointer-events:none}
.fee-hero-eyebrow{font-size:0.72rem;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.fee-hero-amount{font-size:62px;font-weight:400;color:var(--gold);font-family:var(--mono);letter-spacing:-.04em;line-height:1}
.fee-hero-per{font-size:0.95rem;color:var(--dim);margin-top:6px}
.fee-hero-sub{font-size:0.78rem;font-family:var(--mono);color:var(--muted);margin-top:5px}
.metric-strip{display:grid;gap:8px;margin-bottom:10px}
.metric-strip.cols-2{grid-template-columns:1fr 1fr}
.metric-strip.cols-3{grid-template-columns:repeat(3,1fr)}
.metric-card{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:0.68rem;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.metric-val{font-size:1.15rem;font-weight:400;color:var(--text);font-family:var(--mono)}
.metric-sub{font-size:0.73rem;color:var(--muted);margin-top:2px}
.data-table{background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;font-family:var(--mono);font-size:0.84rem}
.dt-head{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:0.68rem;letter-spacing:.06em;text-transform:uppercase;display:grid}
.dt-row{padding:7px 14px;border-bottom:1px solid var(--border);color:var(--text);display:grid}
.dt-row:last-child{border-bottom:none}
.dt-total{padding:9px 14px;border-top:1px solid var(--gold-border);color:var(--gold);display:grid}
.port-cols{grid-template-columns:2fr 1fr 1fr 1fr 80px}
.opex-cols{grid-template-columns:50px 1fr 1fr 1fr 70px}
.inc-list{display:flex;flex-direction:column;gap:5px}
.inc-item{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r)}
.inc-ck{color:var(--gold);flex-shrink:0;margin-top:1px}
.inc-title{font-size:0.95rem;color:var(--text)}
.inc-sub{font-size:0.78rem;color:var(--muted);margin-top:2px}
.q-actions{display:flex;gap:10px;padding-top:22px;border-top:1px solid var(--border)}
.q-disclaimer{margin-top:16px;font-size:0.7rem;color:var(--muted);line-height:1.7;font-family:var(--mono)}

@media(max-width:820px){
  header,footer{padding:14px 18px}
  .stage{padding:18px 16px}
  .prog-track{width:160px}
  .q-wrap{padding:28px 16px 60px}
  .q-head{flex-direction:column}
  .q-meta{text-align:left}
  .metric-strip.cols-3{grid-template-columns:1fr 1fr}
  .port-cols{grid-template-columns:2fr 1fr 1fr}
  .port-cols .hide-sm{display:none}
  .opex-cols{grid-template-columns:44px 1fr 1fr}
  .opex-cols .hide-sm{display:none}
}
</style>
</head>

// Geocode an address via Nominatim, return H3 index at res 6, look up SPD
// Returns: { spd: number|null, hexId: string|null, status: 'found'|'no_data'|'error' }
async function lookupSPD(address) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(address);
    const res = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();
    if (!data || !data.length) return { spd: null, hexId: null, status: 'error' };
    const lat = parseFloat(data[0].lat);
    const lng = parseFloat(data[0].lon);
    const hexId = h3.latLngToCell(lat, lng, 6);
    const spd = HEX_LOOKUP[hexId] ?? null;
    return { spd, hexId, status: spd !== null ? 'found' : 'no_data' };
  } catch(e) {
    return { spd: null, hexId: null, status: 'error' };
  }
}

// Geocode all sites, return array of { address, spd, status }
async function lookupAllSites(sites) {
  const results = [];
  for (const addr of sites) {
    const r = await lookupSPD(addr);
    results.push({ address: addr, ...r });
    await new Promise(resolve => setTimeout(resolve, 200)); // Nominatim rate limit
  }
  return results;
}

// ── PRICING MODEL ────────────────────────────────────────────
// RE400 = 400 kW per stall (2×200 kW dispensers)
// Base from XLSX: 4 stalls, no battery → $514,500 CapEx
// Per-stall hardware cost derived from base
const CAPEX_PER_STALL   = 514500 / 4;   // ~$128,625
const BATTERY_COST      = { 'none':0, '125kw':123000, '250kw':186000 };
const BATTERY_OM_ANNUAL = { 'none':0, '125kw':9000,   '250kw':13500  };  // estimated battery O&M

// Base OpEx profile (4-stall, no battery) from XLSX — indexed Year 1–10
const BASE_OPEX_4STALL = [20607,21109,21626,22159,22708,23274,23857,24458,25077,25715];

function buildCapex(stalls, battery) {
  return stalls * CAPEX_PER_STALL + BATTERY_COST[battery];
}

function buildOpex(stalls, battery) {
  // Scale base opex proportionally to stall count, then add battery O&M
  const scale = stalls / 4;
  const battOM = BATTERY_OM_ANNUAL[battery];
  return BASE_OPEX_4STALL.map((v, i) =>
    Math.round(v * scale + battOM * Math.pow(1.02, i))
  );
}

// ── LCFS ─────────────────────────────────────────────────────
const LCFS_STATES = ['CA','OR','WA','CALIFORNIA','OREGON','WASHINGTON'];
const LCFS_CREDIT_ANNUAL = 20000;  // $ per station per year

function isLCFSEligible(address) {
  const upper = address.toUpperCase();
  return LCFS_STATES.some(s => {
    // Match ", WA" / ", CA" / ", OR" or full state name as word boundary
    return new RegExp('\\b' + s + '\\b').test(upper);
  });
}

// ── FINANCIAL ENGINE ─────────────────────────────────────────
// annualCredit: annual revenue credit that reduces required fee (e.g. LCFS)
function calcFee(stalls, battery, irrPct, annualCredit = 0) {
  const capex = buildCapex(stalls, battery);
  const opex  = buildOpex(stalls, battery);
  const r = irrPct / 100;
  let opexNPV = 0, creditNPV = 0, annuity = 0;
  for (let t = 1; t <= 10; t++) {
    opexNPV   += opex[t-1]      / Math.pow(1+r, t);
    creditNPV += annualCredit   / Math.pow(1+r, t);
    annuity   += 1              / Math.pow(1+r, t);
  }
  const annual = (capex + opexNPV - creditNPV) / annuity;
  return {
    monthly:      annual / 12,
    annual,
    total10:      annual * 10,
    totalOpex:    opex.reduce((a,b) => a+b, 0),
    totalCredits: annualCredit * 10,
    annualCredit,
    opex,
    capex,
    lcfs: annualCredit > 0,
  };
}

function parseSiteText(txt) { return txt.split('\n').map(s=>s.trim()).filter(Boolean); }

function renderSiteTags() {
  const wrap = document.getElementById('site-tags'); if (!wrap) return;
  wrap.innerHTML = S.sites.map((s,i) => `
    <span class="site-tag">${s}
      <button onclick="removeSite(${i})" title="Remove">✕</button>
    </span>`).join('');
  const counter = document.getElementById('site-count');
  if (counter) counter.textContent = S.sites.length ? `${S.sites.length} site${S.sites.length>1?'s':''}` : '';
}

function addSitesFromText() {
  const ta = document.getElementById('siteInput'); if (!ta) return;
  parseSiteText(ta.value).forEach(l => { if (!S.sites.includes(l)) S.sites.push(l); });
  ta.value = '';
  renderSiteTags();
}

function removeSite(i) { S.sites.splice(i,1); renderSiteTags(); }

function handleCSV(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const lines = e.target.result.split('\n').map(l => l.replace(/^["']|["']$/g,'').trim()).filter(Boolean);
    const start = /address|site|location/i.test(lines[0]) ? 1 : 0;
    lines.slice(start).forEach(l => { if (!S.sites.includes(l)) S.sites.push(l); });
    renderSiteTags();
  };
  reader.readAsText(file);
}

function pickStalls(n, el) {
  S.stalls = n;
  el.closest('.stall-grid').querySelectorAll('.stall-tile').forEach(t => t.classList.remove('sel'));
  el.classList.add('sel');
  const hint = el.closest('.slide').querySelector('.stall-grid + div');
  if (hint) hint.innerHTML = `<span style="color:var(--gold);">${n} stalls selected</span> · ${n} × RE400 · 400 kW per port`;
}

      <button class="btn btn-primary" onclick="next()">Continue <svg viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn btn-ghost" onclick="prev()">Back</button>
    </div>
  `, valid: () => {
      if (!S.stalls) { document.getElementById('e-stalls').style.display='block'; return false; }
      document.getElementById('e-stalls').style.display='none';
      return true;
  }},

  // 3 — BATTERY
  { render: () => `
    <div class="eyebrow">Step 2 — Station Configuration</div>
    <h1>Do you want to add a <em>battery</em>?</h1>
    <p class="sub">On-site battery storage lowers utility demand charges, boosts charging capacity above your grid limit, accelerates deployment timelines, and improves station resilience.</p>
    <div class="choices">
      ${[
        ['none',  'No battery',        'Direct grid connection only.',
         'Best for sites with no or low demand charges and sufficient grid supply.'],
        ['125kw', '125 kW Battery',    '125 kW / 250 kWh',
         'Best for moderate demand charges ($5–$14/kW/month) or sites near grid capacity.'],
        ['250kw', '250 kW Battery',    '250 kW / 500 kWh',
         'Best for high demand charges ($14+/kW/month) or high-utilization sites.'],
      ].map(([v, t, tag, d], i) => `
        <div class="choice ${S.battery===v?'sel':''}" onclick="pick('battery','${v}',this)">
          <div class="ck">${String.fromCharCode(65+i)}</div>
          <div class="cb">
            <div class="ct">${t}</div>
            <div class="c-tag">${tag}</div>
            <div class="cd" style="margin-top:6px;">${d}</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="cta-row">
      <button class="btn btn-primary" onclick="showQuote()">Generate quote <svg viewBox="0 0 14 14" fill="none"><path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn btn-ghost" onclick="prev()">Back</button>
    </div>
  `, valid: () => { if (!S.battery) { toast('Please select a battery option.'); return false; } return true; } },
];

// ── NAV ──────────────────────────────────────────────────────
let cur = 0;
function renderProgress() {
  const n = SLIDES.length, pct = Math.round((cur+1)/n*100);
  document.getElementById('prog-bar').style.width = pct+'%';
  document.getElementById('prog-lbl').textContent = `Slide ${cur+1} of ${n}`;
  document.getElementById('dots').innerHTML = SLIDES.map((_,i) =>
    `<div class="dot ${i===cur?'on':i<cur?'done':''}" ${i<cur?`onclick="jumpTo(${i})" style="cursor:pointer"`:''} ></div>`
  ).join('');
}
function render() {
  const stage = document.getElementById('stage');
  const old = stage.querySelector('.slide');
  if (old) { old.classList.add('out'); setTimeout(()=>{ if(old.parentNode) old.parentNode.removeChild(old); }, 250); }
  const div = document.createElement('div'); div.className = 'slide'; div.innerHTML = SLIDES[cur].render();
  setTimeout(() => stage.appendChild(div), old ? 50 : 0);
  renderProgress();
  if (SLIDES[cur].onEnter) SLIDES[cur].onEnter();
}
function next()    { if (!SLIDES[cur].valid()) return; if (cur < SLIDES.length-1) { cur++; render(); } }
function prev()    { if (cur > 0) { cur--; render(); } }
function jumpTo(i) { if (i < cur) { cur=i; render(); } }

function pick(key, val, el) {
  S[key] = val;
  el.closest('.choices').querySelectorAll('.choice').forEach((c,i) => {
    c.classList.toggle('sel', c===el);
    c.querySelector('.ck').textContent = String.fromCharCode(65+i);
  });
}

let _tt;
function toast(msg) {
  clearTimeout(_tt); let t=document.querySelector('.toast'); if(t) t.remove();
  t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  _tt=setTimeout(()=>t&&t.remove(), 3000);
}

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) {
    if (document.getElementById('quote-page').classList.contains('on')) return;
    next();
  }
});

// ── QUOTE ────────────────────────────────────────────────────
async function showQuote() {
  if (!SLIDES[cur].valid()) return;

  // Show loading state
  document.getElementById('app').classList.add('gone');
  const qp = document.getElementById('quote-page');
  qp.classList.add('on');
  qp.scrollTop = 0;
  document.getElementById('q-wrap').innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:18px;">
      <div style="width:38px;height:38px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;"></div>
      <div style="font-family:var(--mono);font-size:0.85rem;color:var(--muted);">Looking up utilization data for your site${S.sites.length>1?'s':''}…</div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  // Geocode all sites
  const siteData = await lookupAllSites(S.sites);

  // Per-site LCFS eligibility — each site gets its own fee
  const siteResults = siteData.map(sd => {
    const lcfs = isLCFSEligible(sd.address);
    const credit = lcfs ? LCFS_CREDIT_ANNUAL : 0;
    const fee = calcFee(S.stalls, S.battery, FIXED_IRR, credit);
    return { ...sd, lcfs, credit, fee };
  });

  // For single-site convenience
  const r  = siteResults[0].fee;
  const n  = S.sites.length;
  S.quoteId   = 'CAAS-' + Date.now().toString(36).toUpperCase().slice(-6);
  S.quoteDate = new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'});

  const isPortfolio = n > 1;
  const portMonthly = siteResults.reduce((a, s) => a + s.fee.monthly, 0);
  const portAnnual  = siteResults.reduce((a, s) => a + s.fee.annual,  0);
  const port10yr    = siteResults.reduce((a, s) => a + s.fee.total10, 0);
  const anyLCFS     = siteResults.some(s => s.lcfs);

  const batteryLabels  = { none:'None', '125kw':'125 kW Nexus BESS', '250kw':'250 kW Nexus BESS' };

  // Per-site opex rows
  const opexRows = r.opex.map((v,i) => {
    const margin = r.annual>0 ? Math.round((r.annual-v)/r.annual*100) : 0;
    return `<div class="dt-row opex-cols">
      <span>Yr ${i+1}</span>
      <span>${fmt(v)}</span>
      <span>${fmt(r.annual)}</span>
      <span class="hide-sm" style="color:${r.annual-v>=0?'var(--gold)':'#ff7070'}">${fmt(r.annual-v)}</span>
      <span class="hide-sm">${margin}%</span>
    </div>`;
  }).join('');
  const totalMargin = r.total10>0 ? Math.round((r.total10-r.totalOpex)/r.total10*100) : 0;

  const siteRows = isPortfolio ? siteResults.map(sd => {
    const spdCell = sd.status === 'found'
      ? `<span style="color:var(--gold);">${sd.spd.toFixed(1)}</span>`
      : `<span style="color:var(--muted);font-size:0.76rem;">No data</span>`;
    const lcfsBadge = sd.lcfs
      ? `<span style="font-size:0.65rem;font-family:var(--mono);background:rgba(248,185,24,.12);border:1px solid var(--gold-border);border-radius:3px;padding:1px 5px;color:var(--gold);margin-left:5px;vertical-align:middle;">LCFS</span>`
      : '';
    return `<div class="dt-row port-cols">
      <span style="color:var(--dim);font-size:0.82rem;">${sd.address}${lcfsBadge}</span>
      <span>${fmt(sd.fee.monthly)}</span>
      <span>${fmt(sd.fee.annual)}</span>
      <span class="hide-sm">${fmt(sd.fee.total10)}</span>
      <span class="hide-sm">${spdCell}</span>
    </div>`;
  }).join('') : '';

  document.getElementById('q-wrap').innerHTML = `
    <div class="q-head">
      <div>
        <div>${EE_SVG}</div>
        <div style="margin-top:14px;">
          <div class="q-title">Charging as a Service Quote</div>
          <div class="q-subtitle">${isPortfolio ? n+'-site portfolio' : S.sites[0]}</div>
        </div>
      </div>
      <div class="q-meta">
        <div class="q-id">${S.quoteId}</div>
        <div class="q-date">${S.quoteDate}</div>
        <div class="q-badge">INDICATIVE · 10-YEAR TERM</div>
      </div>
    </div>

    <!-- HERO -->
    <div class="q-sec">
      <div class="fee-hero">
        <div class="fee-hero-eyebrow">${isPortfolio ? 'Total portfolio monthly fee' : 'Monthly subscription fee'}</div>
        <div class="fee-hero-amount">${fmt(portMonthly)}</div>
        <div class="fee-hero-per">per month · fixed for 10-year term${isPortfolio ? ' · '+n+' sites' : ''}</div>
        <div class="fee-hero-sub">${fmt(portAnnual)}/yr · ${fmt(port10yr)} over full term · CaaS fee is inclusive of LCFS credits where applicable</div>
      </div>
      <div class="metric-strip ${isPortfolio ? 'cols-3' : 'cols-2'}">
        ${isPortfolio ? `
        <div class="metric-card">
          <div class="metric-label">Per-site monthly fee</div>
          <div class="metric-val">${fmt(r.monthly)}</div>
          <div class="metric-sub">${fmt(r.annual)}/yr per site</div>
        </div>` : ''}
        <div class="metric-card">
          <div class="metric-label">${isPortfolio ? 'Portfolio annual fee' : 'Annual fee'}</div>
          <div class="metric-val">${fmt(portAnnual)}</div>
          <div class="metric-sub">${fmt(port10yr)} over 10-year term</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Contract term</div>
          <div class="metric-val">10 years</div>
          <div class="metric-sub">Fixed monthly fee, no CapEx</div>
        </div>
      </div>
    </div>

    <!-- PORTFOLIO SITE TABLE -->
    ${isPortfolio ? `
    <div class="q-sec">
      <div class="q-sec-title">Fee by site</div>
      <div class="data-table">
        <div class="dt-head port-cols"><span>Site address</span><span>Monthly</span><span>Annual</span><span class="hide-sm">10-Yr total</span><span class="hide-sm">Est. SPD (Yr 1)</span></div>
        ${siteRows}
        <div class="dt-total port-cols"><span>Portfolio total</span><span>${fmt(portMonthly)}</span><span>${fmt(portAnnual)}</span><span class="hide-sm">${fmt(port10yr)}</span><span class="hide-sm"></span></div>
      </div>
      <p style="font-size:0.7rem;color:var(--muted);margin-top:7px;font-family:var(--mono);">SPD = sessions per day. Estimated from Paren EV Sessions data.</p>
    </div>` : ''}

    <!-- UTILIZATION -->
    <div class="q-sec">
      <div class="q-sec-title">Estimated site utilization</div>
      ${(() => {
        if (isPortfolio) {
          const found = siteData.filter(s => s.status === 'found');
          const noData = siteData.filter(s => s.status !== 'found');
          if (!found.length) return `<div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 17px;font-size:0.9rem;color:var(--muted);">Not enough data — no utilization estimates available for these locations.</div>`;
          const avgSPD = found.reduce((a,s)=>a+s.spd,0)/found.length;
          return `<div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;">
            <div style="padding:14px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:0.9rem;color:var(--dim);">Portfolio average (${found.length} site${found.length>1?'s':''})</span>
              <span style="font-family:var(--mono);font-size:1.1rem;color:var(--gold);">${avgSPD.toFixed(1)} SPD</span>
            </div>
            ${noData.length ? `<div style="padding:11px 17px;font-size:0.78rem;font-family:var(--mono);color:var(--muted);">Not enough data for ${noData.length} site${noData.length>1?'s':''}: ${noData.map(s=>s.address).join('; ')}</div>` : ''}
          </div>`;
        } else {
          const sd = siteData[0];
          if (sd.status !== 'found') return `<div style="background:var(--s2);border:1px solid var(--border);border-radius:var(--r);padding:14px 17px;font-size:0.9rem;color:var(--muted);">Not enough data — no utilization estimate available for this location.</div>`;
          return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
            <div class="metric-card">
              <div class="metric-label">Est. sessions / day (Yr 1)</div>
              <div class="metric-val" style="color:var(--gold);">${sd.spd.toFixed(1)}</div>
              <div class="metric-sub">Based on nearby station data</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Est. sessions / month (Yr 1)</div>
              <div class="metric-val">${Math.round(sd.spd * 30.4)}</div>
              <div class="metric-sub">30.4-day average</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Est. sessions / year (Yr 1)</div>
              <div class="metric-val">${Math.round(sd.spd * 365)}</div>
              <div class="metric-sub">Annualized</div>
            </div>
          </div>`;
        }
      })()}
      <p style="font-size:0.7rem;color:var(--muted);margin-top:7px;font-family:var(--mono);">Utilization estimates are derived from Paren EV Sessions data. Actual results will vary.</p>
    </div>

    <!-- STATION DETAILS -->
    <div class="q-sec">
      <div class="q-sec-title">Station configuration</div>
      <div class="q-table">
        <div class="q-row"><span class="q-row-name">Charger model</span><span class="q-price">RE400</span></div>
        <div class="q-row"><span class="q-row-name">Charging stalls</span><span class="q-price">${S.stalls} × RE400 (400 kW each)</span></div>
        <div class="q-row"><span class="q-row-name">Battery storage</span><span class="q-price">${batteryLabels[S.battery]}</span></div>
        <div class="q-row"><span class="q-row-name">LCFS / clean fuel credit</span><span class="q-price" style="${anyLCFS?'color:var(--gold)':''}">${anyLCFS ? fmt(LCFS_CREDIT_ANNUAL)+'/yr per eligible site' : 'Not applicable'}</span></div>
        <div class="q-row"><span class="q-row-name">Number of sites</span><span class="q-price">${n}</span></div>
        <div class="q-row"><span class="q-row-name">Contract term</span><span class="q-price">10 years</span></div>
      </div>
    </div>

    <!-- INCLUSIONS -->
    <div class="q-sec">
      <div class="q-sec-title">What's included</div>
      <div class="inc-list">
        ${[
          ['EV charging strategy',              'Pricing strategy, operational strategy, and operations management'], 
          ['Hardware procurement & installation', 'RE400 charger equipment, electrical, and permitting coordination.'],
          ['Full-term operations & maintenance',  'Preventative and corrective maintenance included for 10 years.'],
          ['HaloAI on-charger software',          'Driver support, remote diagnostics, and retail experience features.'],
          ['Network & connectivity',              'LTE/WiFi, OCPP compliance, and cloud monitoring included.'],
        ].map(([t,s]) => `
          <div class="inc-item">
            <span class="inc-ck">✓</span>
            <div><div class="inc-title">${t}</div><div class="inc-sub">${s}</div></div>
          </div>`).join('')}
      </div>
    </div>

    <div class="q-actions">
      <button class="btn btn-primary" onclick="exportPDF()">Download PDF <svg viewBox="0 0 14 14" fill="none"><path d="M7 1v8M4 6l3 3 3-3M2 11h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn btn-ghost" onclick="backToForm()">← Edit inputs</button>
    </div>

    <div class="q-disclaimer">
      This quote is indicative and for discussion purposes only. Actual CaaS fees are subject to final site assessment. © ${new Date().getFullYear()} Electric Era Technologies, Inc.
    </div>
  `;

  qp.scrollTop = 0;
}

function backToForm() {
  document.getElementById('quote-page').classList.remove('on');
  document.getElementById('app').classList.remove('gone');
}

function exportPDF() {
  html2pdf().set({
    margin: [10,10],
    filename: `EE-CaaS-Quote-${S.quoteId}.pdf`,
    image: {type:'jpeg', quality:0.97},
    html2canvas: {scale:2, useCORS:true, backgroundColor:'#28282D'},
    jsPDF: {unit:'mm', format:'a4', orientation:'portrait'}
  }).from(document.getElementById('q-wrap')).save();
}

render();
</script>
</body>
</html>
